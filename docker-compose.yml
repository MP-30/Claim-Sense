services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    volumes:
      - claims-data:/app/data

  ui:
    build: .
    command: ["streamlit", "run", "ui/portal.py", "--server.port", "8501", "--server.address", "0.0.0.0", "--server.headless", "true"]
    environment:
      API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]

volumes:
  claims-data:
