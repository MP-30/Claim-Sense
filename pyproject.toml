[project]
name = "claim-sense"
version = "0.1.0"
description = "Motor insurance claims processing and review"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-postgres>=3.2.1",
    "numpy>=2.5.5",
    "openai>=3.57.0",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "reportlab>=5.1.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0,<3",
    "streamlit>=1.67.0",
]

[build-system]
requires = ["uv_build>=0.7.22,<0.8.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "claim_sense.main:app"
